name: Test Upload File Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-upload-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test file
        run: |
          cat > test-upload.json << 'EOF'
          {
            "message": "This is a test file for upload action",
            "created_at": "$(date -Iseconds)",
          }
          EOF

      - name: Test basic upload
        uses: ./upload-file
        with:
          file_path: test-upload.json
          security_agent_api_key: ${{ secrets.SECURITY_AGENT_API_KEY }}
          tags: |
            scanner=trivy
            image_name=test-image

      - name: Test image name association
        uses: ./upload-file
        with:
          file_path: test-upload.json
          security_agent_api_key: ${{ secrets.SECURITY_AGENT_API_KEY }}
          tags: |
            image_name=test-image

      - name: Test domain association (invalid)
        id: invalid-domain-test
        uses: ./upload-file
        continue-on-error: true
        with:
          file_path: test-upload.json
          security_agent_api_key: ${{ secrets.SECURITY_AGENT_API_KEY }}
          tags: |
            product_domain=invalid-domain
          # TODO: remove before merge
          security_agent_api_endpoint: https://security-agent-dad2e8a5e7.ddn.pro.hasura.io/graphql

      - name: Assert invalid domain test failed
        if: steps.invalid-domain-test.outcome == 'failure'
        run: echo "✅ Invalid domain test correctly failed as expected"

      - name: Fail if invalid domain test unexpectedly succeeded
        if: steps.invalid-domain-test.outcome == 'success'
        run: |
          echo "❌ Invalid domain test should have failed but succeeded"
          exit 1

      - name: Test domain association (valid)
        uses: ./upload-file
        with:
          file_path: test-upload.json
          security_agent_api_key: ${{ secrets.SECURITY_AGENT_API_KEY }}
          tags: |
            scanner=trivy
            image_name=test-image
            product_domain=security-agent-test
          # TODO: remove before merge
          security_agent_api_endpoint: https://security-agent-dad2e8a5e7.ddn.pro.hasura.io/graphql
