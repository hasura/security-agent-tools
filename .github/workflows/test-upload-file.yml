name: Test Upload File Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-upload-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test file
        run: |
          cat > test-upload.json << 'EOF'
          {
            "message": "This is a test file for upload action",
            "created_at": "$(date -Iseconds)",
          }
          EOF

      - name: Test Upload File Action
        uses: ./upload-file
        with:
          file_path: test-upload.json
          security_agent_api_key: ${{ secrets.SECURITY_AGENT_API_KEY }}
          tags: |
            scanner=trivy
            image_name=test-image
            product_domain=test-domain
          # TODO: remove before merging
          security_agent_api_endpoint: https://security-agent-dad2e8a5e7.ddn.pro.hasura.io/graphql
